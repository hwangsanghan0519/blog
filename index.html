      html,body{margin:0;min-height:100%;background:#070707}.ssen-boot{position:relative;display:grid;min-height:100svh;place-items:center;overflow:hidden;color:#fff;background:radial-gradient(circle at 50% 46%,#2b0710 0,transparent 31%),#070707;font-family:Arial,sans-serif}.ssen-boot::before{position:absolute;top:50%;left:50%;width:min(72vw,760px);height:min(72vw,760px);border:1px solid rgba(240,0,47,.14);border-radius:50%;content:"";transform:translate(-50%,-50%);animation:ssen-boot-orbit 8s linear infinite}.ssen-boot-inner{position:relative;display:flex;width:min(76vw,390px);flex-direction:column;align-items:center}.ssen-boot-logo{width:min(72vw,360px);height:auto;filter:drop-shadow(0 12px 38px rgba(240,0,47,.22));animation:ssen-boot-logo 1.7s ease-in-out infinite}.ssen-boot-track{position:relative;width:min(58vw,260px);height:3px;margin-top:28px;overflow:hidden;background:#282828;transform:skewX(-24deg)}.ssen-boot-track::after{position:absolute;inset:0;width:42%;content:"";background:#f0002f;box-shadow:0 0 20px rgba(240,0,47,.8);animation:ssen-boot-progress 1.05s cubic-bezier(.65,0,.35,1) infinite}.ssen-boot-copy{margin:18px 0 0;color:#8d8d8d;font-size:10px;font-weight:800;letter-spacing:.32em;text-indent:.32em}.ssen-boot-dot{position:absolute;top:50%;left:50%;width:min(86vw,460px);height:min(86vw,460px);border:2px solid transparent;border-top-color:#f0002f;border-radius:50%;transform:translate(-50%,-50%);animation:ssen-boot-spin 1.4s linear infinite}.seo-noscript{box-sizing:border-box;min-height:100vh;padding:clamp(72px,12vw,170px) clamp(24px,8vw,120px);color:#fff;background:#070707;font-family:Arial,sans-serif}.seo-noscript h1{max-width:1050px;margin:18px 0;font-size:clamp(46px,9vw,130px);line-height:.92;letter-spacing:-.07em}.seo-noscript p{max-width:720px;font-size:clamp(16px,2vw,23px);line-height:1.65;color:#ddd}@keyframes ssen-boot-spin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes ssen-boot-orbit{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(-360deg)}}@keyframes ssen-boot-progress{0%{transform:translateX(-120%)}50%{width:62%}100%{transform:translateX(260%)}}@keyframes ssen-boot-logo{50%{opacity:.78;transform:scale(.985)}}@media(prefers-reduced-motion:reduce){.ssen-boot::before,.ssen-boot-logo,.ssen-boot-track::after,.ssen-boot-dot{animation:none}.ssen-boot-track::after{left:29%;width:42%}}
