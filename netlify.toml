[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/secret/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/blog/secret/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Domain migration: keep these before every rewrite and preserve the full path/query.
# Netlify primary domain: powerpuffceleb.co.kr; retain old domains as aliases with TLS.
[[redirects]]
  from = "http://powerpuffceleb.co.kr/*"
  to = "https://powerpuffceleb.co.kr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.powerpuffceleb.co.kr/*"
  to = "https://powerpuffceleb.co.kr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.powerpuffceleb.co.kr/*"
  to = "https://powerpuffceleb.co.kr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://ssenshop.co.kr/*"
  to = "https://powerpuffceleb.co.kr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://ssenshop.co.kr/*"
  to = "https://powerpuffceleb.co.kr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.ssenshop.co.kr/*"
  to = "https://powerpuffceleb.co.kr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.ssenshop.co.kr/*"
  to = "https://powerpuffceleb.co.kr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://ssenshop.netlify.app/*"
  to = "https://powerpuffceleb.co.kr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://ssenshop.netlify.app/*"
  to = "https://powerpuffceleb.co.kr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/celeb-house-logo.svg"
  to = "/powerpuffceleb-logo.svg"
  status = 301

[[redirects]]
  from = "/og-image.png"
  to = "/powerpuffceleb-og.png"
  status = 301

[[redirects]]
  from = "/favicon.svg"
  to = "/powerpuffceleb-icon.svg"
  status = 301

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/robots"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/product/:slug"
  to = "/.netlify/functions/seo-page/product/:slug"
  status = 200
  force = true

[[redirects]]
  from = "/celeb/:name"
  to = "/.netlify/functions/seo-page/celeb/:name"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/seo-page/home"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
